################################### GENERAL ####################################
allow_remote_control   yes
# Socket so processes without a tty (e.g. commands Claude runs) can drive panes
# with `kitty @`; restart kitty after changing it
listen_on              unix:/tmp/kitty-{kitty_pid}
copy_on_select         yes
click_interval        -1.0
enabled_layouts       splits,grid,tall,stack
# Left Option acts as Alt (word jumps in zsh, Alt shortcuts in Claude Code and
# herdr); right Option still types special characters
macos_option_as_alt    left
# cmd+click opens URLs (PR links, deploy URLs Claude prints)
detect_urls            yes

##################################### FONT #####################################
font_family            Maple Mono NF
bold_font              Maple Mono NF Bold
italic_font            Maple Mono NF Italic
bold_italic_font       Maple Mono NF Bold Italic
font_size              14
disable_ligatures      never
# CJK from the CN build of the same font, matching Zed's fallback
symbol_map U+4E00-U+9FFF,U+3400-U+4DBF Maple Mono NF CN

#################################### WINDOW ####################################
hide_window_decorations        titlebar-only
window_padding_width           12
# 0.88 (craftzdog runs 0.9): over a bright wallpaper the glass stays dark enough
# for dim text such as comments and file metadata
background_opacity             0.88
background_blur                64
# Lets set_background_opacity change the opacity at runtime
dynamic_background_opacity     yes
remember_window_size           yes

##################################### TAB ######################################
tab_bar_edge                top
# custom = tab_bar.py: craftzdog-style powerline bar (user pill, directory tabs,
# Claude session status, time and host)
tab_bar_style               custom
# Show the tab bar even with one tab so the status is always visible
tab_bar_min_tabs            1

################################### KEYBINDINGS ################################
# Neovim shortcuts, only while nvim runs in the focused window (it sets the
# in_editor user var, see nvim/lua/polish.lua), so they never type into a shell
# or Claude Code
map --when-focus-on var:in_editor cmd+s send_text all \e:w\r
map --when-focus-on var:in_editor cmd+p send_text all :lua Snacks.picker.files()\r
map --when-focus-on var:in_editor cmd+shift+f send_text all :lua Snacks.picker.grep()\r
map --when-focus-on var:in_editor cmd+b send_text all :Neotree toggle\r

map cmd+t new_tab
map cmd+w close_tab
map cmd+shift+] next_tab
map cmd+shift+[ previous_tab
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# Claude workspace splits
map cmd+d launch --location=vsplit
map cmd+shift+d launch --location=hsplit
map cmd+shift+h neighboring_window left
map cmd+shift+l neighboring_window right
map cmd+shift+j neighboring_window down
map cmd+shift+k neighboring_window up
map cmd+alt+w close_window
map cmd+alt+h resize_window narrower 5
map cmd+alt+l resize_window wider 5
map cmd+alt+k resize_window taller 3
map cmd+alt+j resize_window shorter 3
map cmd+shift+m toggle_maximized

# Claude agents
# Move the current pane into another tab (pick the target from a list)
map cmd+alt+m detach_window ask
# Toggle between grid and the previous layout, handy for watching several agents
map cmd+alt+g toggle_layout grid
# Open an agent view pane on the right; -i makes zsh read .zshrc, and the pane
# stays in a shell after it exits
map cmd+shift+a launch --location=vsplit --cwd=current zsh -ic "claude agents; exec zsh"

# copy and paste
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard

#################################### CURSOR ####################################
cursor_blink_interval 0
cursor #FFA500
cursor_trail 20
cursor_trail_decay 0.0 0.3
cursor_trail_start_threshold 10
mouse_hide_wait 0.5

##################################### THEME ####################################
# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME
# Glass over Mocha crust instead of base: a darker tint keeps the frost from
# turning milky and text crisper (the trick behind craftzdog's Solarized Osaka)
background #11111b
# Dim text in unfocused panes so the active Claude pane stands out
inactive_text_alpha 0.7
# Clearer dividers over the darker glass: thicker, and overlay1 instead of overlay0
window_border_width 1pt
inactive_border_color #7f849c

# ssh
shell_integration enabled
