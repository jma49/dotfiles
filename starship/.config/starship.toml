add_newline = true
command_timeout = 1000
scan_timeout = 50

# Top-level keys must come before the first [table]; below it they would
# belong to that table (format used to sit inside the palette and was ignored)
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
${custom.git_end}\
$line_break\
$jobs\
$character"""

right_format = """
$docker_context\
$package\
$nodejs\
$python\
$golang\
$java\
$cmd_duration\
$status\
$time"""

palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

# Prompt in the style of craftzdog's Tide: the path on a surface1 segment (parent
# directories dim, the repo root and below bold) flowing straight into one blue
# git segment holding branch, operation and pending changes.
[directory]
read_only = " 󰌾"
home_symbol = "~"
# Long enough that the repo root stays visible, which the two-tone path needs
truncation_length = 8
truncate_to_repo = false
style = "bg:surface1 fg:text bold"
before_repo_root_style = "bg:surface1 fg:subtext0"
repo_root_style = "bg:surface1 fg:text bold"
# Outside a repo the path closes its own segment
format = "[ $path$read_only ]($style)[](fg:surface1)"
# Inside a repo: parents dim, repo root and below bold, then straight into the blue git segment
repo_root_format = "[ $before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path$read_only ]($style)[](fg:surface1 bg:blue)"

[character]
success_symbol = "[❯](bold peach)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[status]
disabled = false
map_symbol = true
success_symbol = "[✓](green)"
format = "$common_symbol "
style = "text"

# Closes the blue git segment. Literal text inside a conditional (...) group is
# dropped, so this module renders it, only inside a repo and without running a command.
[custom.git_end]
when = true
require_repo = true
format = "[ ](bg:blue)[](fg:blue)"

[git_branch]
symbol = " "
format = "[ $symbol$branch]($style)"
style = "bg:blue fg:crust bold"

[git_status]
style = "bg:blue fg:crust"
ahead = "↑$count"
behind = "↓$count"
diverged = "↑$ahead_count↓$behind_count"
conflicted = "✗$count"
staged = "+$count"
modified = "~$count"
renamed = "»$count"
untracked = "?$count"
deleted = "-$count"
stashed = "≡$count"
format = "([ $conflicted$staged$modified$renamed$untracked$deleted$stashed$ahead_behind]($style))"

[git_state]
format = "[ $state( $progress_current/$progress_total)]($style)"
style = "bg:blue fg:crust bold"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[python]
symbol = "  "
format = "[$symbol$virtualenv ($version)]($style) "
style = "green"
disabled = false

[hostname]
ssh_symbol = "󰢹 "

[gcloud]
symbol = "  "
disabled = true

[jobs]
symbol = "⚙"
style = "pink"
threshold = 1
disabled = false
format = "[$symbol$number]($style) "

